name: Refresh feeds

# Saves a fresh copy of every show's feed into the feeds folder, so the player
# can always read them. Times are UTC: every 20 minutes from 10:00 to 17:59 UTC
# (4 to 11 a.m. Mountain), and once an hour the rest of the day.
on:
  schedule:
    - cron: "*/20 10-17 * * *"
    - cron: "5 0-9,18-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download feeds
        shell: python
        run: |
          import json, os, re, urllib.request

          KEEP = 6  # newest episodes to keep from each feed
          os.makedirs("feeds", exist_ok=True)
          with open("sources.json", encoding="utf-8") as f:
              sources = json.load(f)

          ok = 0
          for src in sources:
              sid, url = src.get("id"), src.get("url")
              if not sid or not url or not re.fullmatch(r"[A-Za-z0-9._-]+", sid):
                  print(f"::warning::Skipped an entry with a missing or invalid id: {src}")
                  continue
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (compatible; MorningLineup/1.0; personal feed cache)",
                      "Accept": "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8",
                  })
                  with urllib.request.urlopen(req, timeout=30) as r:
                      xml = r.read().decode("utf-8", "replace")
              except Exception as e:
                  print(f"::warning::{sid}: could not download ({e})")
                  continue
              if not re.search(r"<(rss|feed)[\s>]", xml[:4000]):
                  print(f"::warning::{sid}: the address did not return a podcast feed")
                  continue
              ends = [m.end() for m in re.finditer(r"</item>", xml)]
              if len(ends) > KEEP:
                  xml = xml[:ends[KEEP - 1]] + "\n</channel>\n</rss>\n"
              else:
                  ends = [m.end() for m in re.finditer(r"</entry>", xml)]
                  if len(ends) > KEEP:
                      xml = xml[:ends[KEEP - 1]] + "\n</feed>\n"
              with open(os.path.join("feeds", sid + ".xml"), "w", encoding="utf-8") as f:
                  f.write(xml)
              ok += 1
              print(f"{sid}: saved")
          print(f"{ok} of {len(sources)} feeds saved")

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Refresh feeds"
            git pull --rebase
            git push
          fi
